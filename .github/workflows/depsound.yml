# Two jobs keep untrusted dependency analysis separate from the write token.
# pull_request_target runs this base-branch workflow, and no PR code is
# checked out or executed.
name: depsound
on:
  pull_request_target:

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: rvagg/depsound-action@7c7eb2bfc936dc8242f0592f6d7c4f9835510380 # v0.3.6
  post:
    needs: review
    if: ${{ always() && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
      actions: read
    steps:
      - uses: rvagg/depsound-action/post@7c7eb2bfc936dc8242f0592f6d7c4f9835510380 # v0.3.6
