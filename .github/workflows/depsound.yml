# Two jobs keep untrusted dependency analysis separate from the write token.
# pull_request_target runs this base-branch workflow, and no PR code is
# checked out or executed.
name: depsound
on:
  pull_request_target:

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: rvagg/depsound-action@49940d1f04828a01799cc129f3930d9bd42bceda # v0.5.0
  post:
    needs: review
    if: ${{ always() && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
      actions: read
    steps:
      - uses: rvagg/depsound-action/post@49940d1f04828a01799cc129f3930d9bd42bceda # v0.5.0
